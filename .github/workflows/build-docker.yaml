name: Build Docker for me (Akhsaul)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/**
    tags:
      - '**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bifrost
  IMAGE_HERMES_NAME: ${{ github.repository_owner }}/bifrost-hermes
  GO_VERSION: "1.27.0"

jobs:
  test-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: test-binary
      cancel-in-progress: true # sometime bugfixes coming too fast, so cancel previous test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run CLI tests
        working-directory: cli
        run: go test ./...

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::9}" >> $GITHUB_ENV

      - name: Determine Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
            echo "BIFROST_VERSION=${RAW_TAG#[vV]}" >> $GITHUB_ENV
          else
            echo "BIFROST_VERSION=dev-${GITHUB_SHA::9}" >> $GITHUB_ENV
          fi

      - name: Test build docker image (bifrost-hermes)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: transports/Dockerfile.hermes
          build-args: |
            VERSION=${{ env.BIFROST_VERSION }}
            APP_PORT=2972
          no-cache: true
          push: false
          tags: ${{ format('bifrost-hermes:dev-{0}', env.SHORT_SHA) }}
          load: true

      - name: Test run bifrost-hermes container
        run: |
          IMAGE_TAG="${{ format('bifrost-hermes:dev-{0}', env.SHORT_SHA) }}"
          CONTAINER_NAME="bifrost-hermes-test"
          
          echo "Starting test container $CONTAINER_NAME..."
          docker run -d --name "$CONTAINER_NAME" \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_PORT=9000 \
            -e MINIO_CONSOLE_PORT=9001 \
            -e MINIO_BUCKET=bifrost-logs \
            -e APP_PORT=2972 \
            -e APP_HOST=0.0.0.0 \
            -e LOG_LEVEL=warn \
            -e BIFROST_ENCRYPTION_KEY=test_encryption_key_32_bytes_len! \
            -e BIFROST_ADMIN_USERNAME=admin \
            -e BIFROST_ADMIN_PASSWORD=adminpass \
            -p 2972:2972 \
            -p 9000:9000 \
            "$IMAGE_TAG"
          
          echo "Waiting for container and services to initialize..."
          SUCCESS=0
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null | grep -q true; then
              echo "ERROR: Container stopped unexpectedly!"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            
            if curl -sf http://127.0.0.1:2972/health >/dev/null 2>&1; then
              echo "Bifrost health check passed at ${i}s!"
              SUCCESS=1
              break
            fi
            sleep 1
          done
          
          echo "=== Container Logs (Runtime Diagnostics) ==="
          docker logs "$CONTAINER_NAME"
          
          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Bifrost failed to become healthy within 30 seconds!"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            exit 1
          fi
          
          echo "Verifying MinIO readiness endpoint..."
          curl -fv http://127.0.0.1:9000/minio/health/ready || (echo "MinIO health check failed!" && exit 1)
          
          echo "Checking container logs for startup errors..."
          LOGS=$(docker logs "$CONTAINER_NAME" 2>&1)
          if echo "$LOGS" | grep -iE 's6-rc-oneshot-run: fatal:|\[stage2\] ERROR:|Permission denied: '\''/opt/data|exited [1-9]|command exited 12[67]'; then
            echo "ERROR: Found fatal errors in container startup logs!"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            exit 1
          fi
          
          echo "Stopping and cleaning up test container..."
          docker stop "$CONTAINER_NAME"
          docker rm "$CONTAINER_NAME"
          echo "All container runtime tests passed successfully!"

      - name: Check docker images by dive
        uses: MaxymVlasov/dive-action@9bfaea6c0b1e49111459b2cb3f9275fa4094a63e # v2.0.1
        with:
          image: ${{ format('bifrost-hermes:dev-{0}', env.SHORT_SHA) }}
          highest-user-wasted-ratio: 1.0
          lowest-efficiency-ratio: 0.0

      - name: Check docker images
        run: |
          docker image list | grep bifrost
          docker history ${{ format('bifrost-hermes:dev-{0}', env.SHORT_SHA) }} --no-trunc

  release-cli:
    needs: [test-cli]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-docker-image
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Determine Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
            echo "BIFROST_VERSION=${RAW_TAG#[vV]}" >> $GITHUB_ENV
          else
            echo "BIFROST_VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Docker meta (bifrost)
        id: meta-bifrost
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dev-${{ env.SHORT_SHA }},enable=${{ github.ref_type != 'tag' }}

      - name: Docker meta (bifrost-hermes)
        id: meta-hermes
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_HERMES_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dev-${{ env.SHORT_SHA }},enable=${{ github.ref_type != 'tag' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (bifrost)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: transports/Dockerfile.custom
          build-args: |
            VERSION=${{ env.BIFROST_VERSION }}
            APP_PORT=2972
          no-cache: true
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
          tags: ${{ steps.meta-bifrost.outputs.tags }}
          labels: ${{ steps.meta-bifrost.outputs.labels }}

      - name: Build and push (bifrost-hermes)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: transports/Dockerfile.hermes
          build-args: |
            VERSION=${{ env.BIFROST_VERSION }}
            APP_PORT=2972
          no-cache: true
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
          tags: ${{ steps.meta-hermes.outputs.tags }}
          labels: ${{ steps.meta-hermes.outputs.labels }}
